[tool]
id = "com.thelightphone.radio"
label = "Radio"
versionCode = 11
versionName = "1.3.2"
permissions = [
    "android.permission.INTERNET",
    "android.permission.POST_NOTIFICATIONS",
    "android.permission.WAKE_LOCK"
]
capabilities = ["detached-audio", "cleartext-http"]
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
sharedUserId = "com.thelightphone.sdk"
orientation = "portrait"
enableBackgroundAudio = true
