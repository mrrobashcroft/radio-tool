[tool]
id = "com.thelightphone.radio"
label = "Radio"
versionCode = 3
versionName = "1.2.0"
permissions = [
    "android.permission.INTERNET",
    "android.permission.POST_NOTIFICATIONS",
    "android.permission.WAKE_LOCK"
]
# detached-audio: playback runs in the SDK's LightAudioService, so the stream
# survives the tool losing foreground (screen off / tool closed).
capabilities = ["detached-audio"]
# Real LP3: com.lightos (LightOS's own SDK server). Emulator: flip to
# com.thelightphone.sdk.emulator (or pm grant CAMERA/BLUETOOTH there).
serverPackage = "com.lightos"
sharedUserId = "com.thelightphone.sdk"
orientation = "portrait"
